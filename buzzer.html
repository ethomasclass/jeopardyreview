<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Showdown · Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03072b;color:#fff;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:20px;--c:#f5c542}
a{color:#f5c542}a:hover{color:#ffe08a}
button,input{font:inherit;color:inherit}
body{display:flex;flex-direction:column;min-height:100vh}
#top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#000;border-bottom:6px solid var(--c)}
.dot{width:12px;height:12px;border-radius:50%;background:#ff6b5a}.dot.on{background:#3ecf7a}
.tt{flex:1;font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.ts{font-family:Anton;font-size:34px;line-height:1}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:22px;text-align:center;max-width:900px;width:100%;margin:0 auto}
.logo{font-family:Anton;font-size:52px;text-transform:uppercase;line-height:1;text-shadow:3px 3px 0 #000}.logo span{color:#f5c542}
.big{font-family:Anton;font-size:clamp(34px,7vw,56px);text-transform:uppercase;line-height:1.05}
.big.ok{color:#5ee69a}.big.no{color:#ff8a7a}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:#f5c542;font-size:18px}
p{margin:0;font-size:24px;line-height:1.35;color:#d4d8f5;text-wrap:pretty}
.delta{font-family:Anton;font-size:44px;color:#fff}
.btn{background:#f5c542;color:#0a0f3d;border:0;border-radius:8px;padding:.55em 1.3em;font-weight:800;font-size:24px;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.link{background:none;border:0;color:#f5c542;text-decoration:underline;font-size:20px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.codein{font-family:Anton;font-size:72px;letter-spacing:.2em;text-align:center;text-transform:uppercase;width:min(340px,90vw);background:#0a1477;border:3px solid #2b3ab8;border-radius:10px;padding:6px 0 6px .2em;outline:none}
.codein:focus{border-color:#f5c542}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.tbtn{background:#0a1477;border:0;border-top:10px solid var(--c);border-radius:10px;padding:22px 14px;font-weight:800;font-size:28px;text-transform:uppercase;cursor:pointer}
.tbtn:hover{background:#13239a}
.buzz{width:min(62vmin,380px);aspect-ratio:1;border-radius:50%;border:0;font-family:Anton;font-size:clamp(44px,10vmin,76px);text-transform:uppercase;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .06s}
.buzz.go{background:var(--c);color:#0a0f3d;box-shadow:0 10px 0 rgba(0,0,0,.45),0 0 60px var(--c)}
.buzz.go:active,.buzz.pressed{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.45),0 0 80px var(--c)}
.buzz.wait{background:#2a3170;color:#9aa2d8;box-shadow:0 10px 0 rgba(0,0,0,.45)}
.buzz.off{background:#151a4a;color:#5d6496;cursor:default}
.buzz.early{background:#ff6b5a;color:#2a0500}
.chead{display:flex;justify-content:space-between;gap:12px;width:100%;font-weight:800;text-transform:uppercase;font-size:20px;border-bottom:2px solid #2b3ab8;padding-bottom:6px}
.chead b{font-family:Anton;font-weight:400;color:#f5c542}
.cclue{background:#0d1fb0;padding:18px 22px;font-family:'Libre Baskerville',serif;font-weight:700;text-transform:uppercase;font-size:clamp(18px,3.2vw,26px);line-height:1.35;text-shadow:2px 2px 0 #000;width:100%;border-radius:4px}
form{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.ain{width:100%;font-size:32px;padding:14px 16px;border-radius:10px;border:3px solid var(--c);background:#fff;color:#000;outline:none;text-align:center}
.ctimer{display:flex;align-items:center;gap:12px;width:100%}
.tbar{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:7px;overflow:hidden}.tbar>i{display:block;height:100%;background:var(--c);width:100%}
.tnum{font-family:Anton;font-size:36px;width:48px}
.howto{background:#0a1477;border-radius:10px;padding:14px 18px;text-align:left;width:100%}
.howto ol{margin:6px 0 0;padding-left:1.2em;font-size:20px;line-height:1.45;color:#d4d8f5}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.rank li{display:flex;justify-content:space-between;background:#0a1477;border-left:10px solid var(--c);padding:10px 18px;font-size:26px;font-weight:800;text-transform:uppercase}
.rank b{font-family:Anton;font-weight:400}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;width:100%}
.cbtn{display:flex;gap:12px;align-items:center;text-align:left;background:#0a1477;border:3px solid var(--c);border-radius:10px;padding:14px 16px;font-size:24px;font-weight:700;cursor:pointer;min-height:70px;line-height:1.1}
.cbtn b{font-family:Anton;font-weight:400;color:var(--c);font-size:30px;flex:none}
.cbtn:hover:not(:disabled){background:#13239a}
.cbtn:disabled{opacity:.25;text-decoration:line-through;cursor:default}
</style>
</head>
<body>
<div id="top"></div>
<div id="main"></div>
<script>
const LSK='cpaReview.buzzer.v1';
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−':'')+Math.abs(n).toLocaleString();
let me={};try{me=JSON.parse(localStorage.getItem(LSK)||'{}')||{}}catch(e){}
const qp=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z]/g,'');
if(qp&&qp!==me.code)me={code:qp};
const saveMe=()=>{try{localStorage.setItem(LSK,JSON.stringify(me))}catch(e){}};
const BROKERS=[{url:'wss://public.cloud.shiftr.io',username:'public',password:'public'},{url:'wss://broker.emqx.io:8084/mqtt'},{url:'wss://broker.hivemq.com:8884/mqtt'}];
const myId=(()=>{let x;try{x=sessionStorage.getItem('cpaReview.id')}catch(e){}if(!x){x=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('cpaReview.id',x)}catch(e){}}return x})();
let cl=null,bi=0,snap=null,xsnap=null,status='',connected=false,gotSnap=false,findT,teamTopic=null,wanted=me.code||null,deadline=0,total=1,earlyUntil=0,lastMain='',sending=false;
const base=()=>'cpareview/v1/'+wanted;
function disconnect(){clearTimeout(findT);if(cl){const c=cl;cl=null;try{c.end(true)}catch(e){}}connected=false;teamTopic=null}
function connect(){
  if(typeof mqtt==='undefined'){status='The buzzer could not load. Check the internet connection and reload the page.';render();return}
  disconnect();gotSnap=false;snap=null;xsnap=null;const B=BROKERS[bi];
  const c=mqtt.connect(B.url,{username:B.username,password:B.password,clientId:'cpas_'+myId+'_'+bi+'_'+Math.random().toString(36).slice(2,6),reconnectPeriod:2000,connectTimeout:7000,clean:true});cl=c;
  c.on('connect',()=>{if(c!==cl)return;c.subscribe([base()+'/t/x',base()+'/c/'+myId]);teamTopic=null;if(me.team!=null)subTeam(me.team);
    send({t:'hello',team:me.team??null,name:me.teamName||null});
    clearTimeout(findT);findT=setTimeout(()=>{if(!gotSnap)nextBroker('No game found with code '+wanted+' yet. Check the code on the board.')},5000)});
  c.on('message',(t,p)=>{if(c!==cl)return;let m;try{m=JSON.parse(p.toString())}catch(e){return}onMsg(t,m)});
  c.on('offline',()=>{if(c!==cl)return;connected=false;status='Lost the connection. Reconnecting…';render()});
  c.on('error',()=>{});
  clearTimeout(findT);findT=setTimeout(()=>{if(!gotSnap)nextBroker('Still connecting… trying another route.')},9000);
}
function nextBroker(msg){status=msg;bi=(bi+1)%BROKERS.length;connect();render()}
function subTeam(i){if(!cl)return;if(teamTopic)cl.unsubscribe(teamTopic);teamTopic=base()+'/t/'+i;cl.subscribe(teamTopic)}
function unsubTeam(){if(cl&&teamTopic)cl.unsubscribe(teamTopic);teamTopic=null}
function send(m){if(cl&&cl.connected&&wanted)cl.publish(base()+'/up',JSON.stringify({...m,id:myId}))}
setInterval(()=>send({t:'ping'}),5000);
function onMsg(topic,m){
  if(m.t==='snap'){const isX=topic.endsWith('/t/x');if(isX)xsnap=m;
    if(isX?me.team!=null:m.you!==me.team)return;
    gotSnap=true;connected=true;status='';snap=m;sending=false;
    const tl=m.cur&&m.cur.timeLeft?m.cur:(m.final&&m.final.timeLeft?m.final:null);
    if(tl){deadline=Date.now()+tl.timeLeft;total=tl.timeTotal}else deadline=0;
    render()}
  else if(m.t==='joined'){if(m.team==null&&me.team!=null){me.team=null;me.teamName=null;saveMe();unsubTeam();if(xsnap)snap=xsnap;render()}}
  else if(m.t==='early'){earlyUntil=Date.now()+1000;navigator.vibrate&&navigator.vibrate(200);render();setTimeout(render,1050)}
}
function doBuzz(){if(!connected||Date.now()<earlyUntil)return;const b=$('.buzz');if(!b||b.classList.contains('off'))return;
  send({t:'buzz'});b.classList.add('pressed');setTimeout(()=>b&&b.classList.remove('pressed'),150);navigator.vibrate&&navigator.vibrate(40)}

const early=()=>Date.now()<earlyUntil;
const buzzBtn=(k,l)=>`<button class="buzz ${k}" data-buzz>${l}</button>`;
const timer=()=>`<div class="ctimer"><div class="tbar"><i id="ctbar"></i></div><span id="ctnum" class="tnum"></span></div>`;
const choiceForm=(kind,ch,struck,title)=>`${title?`<div class="big">${title}</div>`:''}<div class="cgrid">${ch.map((x,k)=>`<button class="cbtn" data-choice="${k}" data-kind="${kind}" ${(struck||[]).includes(k)?'disabled':''}><b>${'ABCD'[k]}</b><span>${h(x)}</span></button>`).join('')}</div>${timer()}`;
const respond=(kind,ch,struck,title)=>ch?choiceForm(kind,ch,struck,title):answerForm(kind,title);
const answerForm=(kind,title)=>`<form data-form="${kind}">${title?`<div class="big">${title}</div>`:''}<input class="ain" name="a" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Type your answer" autofocus>${timer()}<button class="btn">Send answer</button></form>`;
const wagerForm=(kind,max,title)=>`<form data-form="${kind}"><div class="big">${title}</div><p>You can bet 0 to ${max}.</p><input class="ain" name="w" type="number" min="0" max="${max}" inputmode="numeric" autofocus placeholder="Wager"><div class="row"><button type="button" class="btn ghost" data-allin="${max}">All in (${max})</button><button class="btn">Lock wager</button></div></form>`;

function mainHTML(){
  if(!wanted)return `<form data-form="join"><div class="logo">Review <span>Showdown</span></div><p>Type the room code shown on the board.</p><input class="codein" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus><button class="btn">Join game</button></form>`;
  if(!connected)return `<div class="big">Connecting to ${h(wanted)}…</div><p>${h(status)}</p><button class="link" data-leave>Use a different code</button>`;
  if(!snap)return `<div class="big">Connected</div>`;
  const P=snap.phase,M=snap.you,c=snap.cur,f=snap.final,tn=i=>h(snap.teams[i].name);
  if(M==null)return `<div class="big">Pick your team</div><div class="teams">${snap.teams.map((t,i)=>`<button class="tbtn" style="--c:${t.color}" data-team="${i}">${h(t.name)}</button>`).join('')}</div><button class="link" data-leave>Leave game</button>`;
  if(P==='setup'||P==='lobby')return `<div class="eyebrow">You're on</div><div class="big">${tn(M)}</div><p>Waiting for the game to start. Tap BUZZ to test it. Your team lights up on the board.</p>${buzzBtn('go','Buzz')}
    <div class="howto"><div class="eyebrow">How to play</div><ol><li>${snap.mc?'Clues are definitions. Pick the matching term from 4 choices. The wrong ones are close.':'Clues are definitions. Answer with the term. A few words is enough.'}</li><li>Wait until the board glows gold, then buzz.</li><li>Buzz too early and you're locked out for 1 second.</li><li>If you buzz first, ${snap.mc?'tap your choice':'type your answer'} here in ${snap.timer} seconds.</li></ol></div>
    <button class="link" data-switch>Switch team</button>`;
  if(P==='board')return (snap.control===M?`<div class="big">Your team picks!</div><p>Tell your teacher which clue you want.</p>`:`<div class="big">${tn(snap.control)} is picking</div><p>Get ready to buzz.</p>`)+buzzBtn('off','Wait');
  if(P==='clue'&&c){const head=`<div class="chead"><span>${h(c.category)}</span><b>${c.dd?'Daily Double':c.points}</b></div>`,clue=c.clue?`<div class="cclue">${h(c.clue)}</div>`:'';
    if(c.state==='dd-intro'||c.state==='dd-wager'){
      if(c.ddTeam===M&&c.state==='dd-wager')return head+(c.wager!=null?`<div class="big">Wager locked: ${c.wager}</div><p>The clue will show on the board.</p>`:wagerForm('ddwager',c.wagerMax,'Daily Double! Make your wager'));
      return head+`<div class="big">Daily Double!</div><p>${tn(c.ddTeam)} plays this one.</p>`}
    if(c.dd&&(c.state==='reading'||c.state==='answering')){
      if(c.ddTeam!==M)return head+clue+`<p>${tn(c.ddTeam)} is answering the Daily Double.</p>`;
      if(c.state==='reading')return head+clue+`<p>Your timer starts when your teacher says go.</p>`;
      return head+clue+(c.answered||sending?`<div class="big">Answer sent</div>`:respond('answer',c.choices,c.struck))}
    if(c.state==='reading')return head+clue+buzzBtn(early()?'early':'wait',early()?'Too early!':'Wait…');
    if(c.state==='open')return head+clue+(c.locked.includes(M)?`<p>Your team already tried this one.</p>`+buzzBtn('off','Locked'):buzzBtn(early()?'early':'go',early()?'Too early!':'Buzz!'));
    if(c.state==='answering'){if(c.buzzTeam===M)return head+clue+(c.answered||sending?`<div class="big">Answer sent</div>`:respond('answer',c.choices,c.struck,'You buzzed first!'));
      return head+clue+`<div class="big">${tn(c.buzzTeam)} buzzed in</div>`+buzzBtn('off','Wait')}
    if(c.state==='judged'){const mine=c.buzzTeam===M,ok=c.verdict;
      return head+clue+`<div class="big ${ok?'ok':'no'}">${mine?(ok?'Correct!':'Not quite'):`${tn(c.buzzTeam)} was ${ok?'right':'wrong'}`}</div>${mine&&c.delta?`<div class="delta">${c.delta>0?'+':'−'}${Math.abs(c.delta)}</div>`:''}${c.answer?`<p>Answer: <b>${h(c.answer)}</b></p>`:''}`}
    if(c.state==='revealed')return head+clue+`<p>Answer: <b>${h(c.answer)}</b></p>`}
  if(P==='final'&&f){const head=`<div class="chead"><span>Final Round</span><b>${h(f.category)}</b></div>`;
    if(f.state==='category')return head+(f.wagered||sending?`<div class="big">Wager locked</div><p>Wait for the final clue.</p>`:wagerForm('fwager',f.wagerMax,'Final Round wager'));
    if(f.state==='clue')return head+`<div class="cclue">${h(f.clue)}</div>`+(f.answered||sending?`<div class="big">Answer locked in</div>`:respond('fanswer',f.choices,[]));
    return head+`<div class="big">Watch the board</div>`}
  if(P==='end'){const R=snap.teams.slice().sort((a,b)=>b.score-a.score);
    return `<div class="eyebrow">Final scores</div><ol class="rank">${R.map(t=>`<li style="--c:${t.color}"><span>${h(t.name)}</span><b>${fmt(t.score)}</b></li>`).join('')}</ol>`}
  return `<div class="big">Watch the board</div>`;
}
function render(){
  const t=snap&&snap.you!=null&&connected?snap.teams[snap.you]:null;
  document.body.style.setProperty('--c',t?t.color:'#f5c542');
  $('#top').innerHTML=`<div class="dot ${connected?'on':''}"></div><div class="tt">${t?h(t.name):'Review Showdown'}</div>${t?`<div class="ts">${fmt(t.score)}</div>`:''}`;
  const html=mainHTML();
  if(html!==lastMain){$('#main').innerHTML=html;lastMain=html;const a=$('#main [autofocus]');if(a)a.focus()}
  tick();
}
function tick(){const b=$('#ctbar'),n=$('#ctnum');if(!b||!n)return;const left=Math.max(0,deadline-Date.now());
  b.style.width=(deadline?left/total*100:0)+'%';n.textContent=deadline?Math.ceil(left/1000):''}
setInterval(tick,100);

document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-buzz]')){e.preventDefault();doBuzz()}});
document.addEventListener('keydown',e=>{if(e.target.matches&&e.target.matches('input'))return;if(e.code==='Space'||e.key==='Enter'){if($('[data-buzz]')){e.preventDefault();doBuzz()}}});
document.addEventListener('click',e=>{const t=e.target;
  const cb=t.closest('[data-choice]');if(cb&&!cb.disabled){send({t:cb.dataset.kind,choice:+cb.dataset.choice});sending=true;render();return}
  const tb=t.closest('[data-team]');if(tb){const i=+tb.dataset.team;me.team=i;me.teamName=snap.teams[i].name;saveMe();subTeam(i);send({t:'join',team:i,name:me.teamName});return}
  if(t.closest('[data-switch]')){me.team=null;me.teamName=null;saveMe();unsubTeam();send({t:'leave'});snap=xsnap||snap;if(snap)snap={...snap,you:null};render();return}
  if(t.closest('[data-leave]')){disconnect();wanted=null;snap=null;xsnap=null;me={};saveMe();render();return}
  const ai=t.closest('[data-allin]');if(ai){const inp=ai.closest('form').querySelector('input');inp.value=ai.dataset.allin;inp.focus()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='join'){const code=(f.code.value||'').toUpperCase().replace(/[^A-Z]/g,'');if(code.length!==4){f.code.focus();return}
    wanted=code;me={code};saveMe();status='';bi=0;connect();render();return}
  if(k==='answer'||k==='fanswer'){const v=f.a.value.trim();if(!v){f.a.focus();return}send({t:k,text:v});sending=true;render();return}
  if(k==='ddwager'||k==='fwager'){const v=parseInt(f.w.value);if(isNaN(v)){f.w.focus();return}send({t:'wager',amount:v});sending=true;render()}});
render();if(wanted)connect();
</script>
</body>
</html>
