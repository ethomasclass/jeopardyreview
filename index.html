<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03072b;color:#fff;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:20px}
a{color:#f5c542}a:hover{color:#ffe08a}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit}
kbd{font-family:inherit;font-size:.7em;border:1.5px solid currentColor;border-radius:4px;padding:0 .35em;margin-left:.4em;opacity:.7}

.btn.good{background:#3ecf7a;color:#03240f}.btn.bad{background:#ff6b5a;color:#2a0500}
.btn.sm{font-size:17px;padding:.4em .8em}.btn.big{font-size:28px;padding:.55em 1.4em}
.link{background:none;border:0;color:#f5c542;text-decoration:underline;padding:0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:#aeb6e8}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:#f5c542;font-size:18px}
/* setup */
.setup{max-width:1180px;margin:0 auto;padding:36px 28px 60px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.logo{font-family:Anton,sans-serif;font-size:56px;line-height:1;text-transform:uppercase;letter-spacing:.02em;text-shadow:3px 3px 0 #000}
.logo span{color:#f5c542}
.sub{color:#aeb6e8;font-size:22px}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
.panel{background:#0a1477;border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:26px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.panel h3 b{font-family:Anton;background:#f5c542;color:#0a0f3d;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:400}
.setname{font-family:Anton;font-size:34px;line-height:1.05}
.stats{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#13239a;padding:3px 10px;border-radius:4px;font-size:17px;font-weight:600}
.warn{background:#3a2a00;border:1px solid #f5c542;border-radius:6px;padding:10px 12px;font-size:17px}
details summary{cursor:pointer;color:#f5c542;font-size:18px}
details textarea{width:100%;height:110px;margin:8px 0;background:#040a45;color:#fff;border:1px solid #2b3ab8;border-radius:6px;padding:8px;font-size:15px}
.seg{display:inline-flex;background:#040a45;border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 14px;border-radius:6px;font-weight:700;font-size:19px;color:#c8cdf0}
.seg button.on{background:#f5c542;color:#0a0f3d}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.opt>span{font-size:20px;font-weight:600}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.names label{display:flex;align-items:center;gap:8px;background:#040a45;border-radius:6px;padding:4px 4px 4px 10px;border-left:6px solid var(--c)}
.names input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-size:20px;font-weight:700;padding:6px 4px;outline:none}
.desc{font-size:18px;color:#c8cdf0;line-height:1.35;margin:0}
.setup-foot{display:flex;justify-content:flex-end}
/* lobby */
.lobby{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;padding:36px;max-width:1500px;margin:0 auto;align-content:center}
.joincard{min-width:0;max-width:100%;background:#0a1477;border-radius:12px;padding:28px 30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.joincard ol{margin:0;padding-left:1.2em;font-size:26px;line-height:1.5}
.joincard ol b{color:#f5c542;overflow-wrap:anywhere}
.code{font-family:Anton;font-size:clamp(80px,10vw,150px);line-height:1;letter-spacing:.12em;color:#f5c542;text-shadow:4px 4px 0 #000}
.qr{background:#fff;padding:10px;border-radius:8px;width:190px;height:190px}
.pstat{font-size:18px;display:flex;align-items:center;gap:8px}
.pstat i{width:12px;height:12px;border-radius:50%;background:#888;display:inline-block}
.pstat.ready i{background:#3ecf7a}.pstat.error i{background:#ff6b5a}
.lteams{display:flex;flex-direction:column;gap:16px}
.lteams h2{margin:0;font-family:Anton;font-weight:400;font-size:40px;text-transform:uppercase}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{background:#0a1477;border-radius:10px;padding:16px 18px;border-top:8px solid var(--c);transition:box-shadow .15s,transform .15s}
.tcard.flash{box-shadow:0 0 0 4px var(--c),0 0 40px var(--c);transform:scale(1.04)}
.tcard .n{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1}
.tcard .d{font-size:19px;color:#c8cdf0;margin-top:6px}
.tcard .k{font-family:Anton;font-size:44px;color:var(--c);line-height:1;margin-top:8px}
.lfoot{grid-column:1/-1;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
/* shell */
.shell{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#000}
.top{display:flex;align-items:center;gap:16px;padding:8px 16px;background:#03072b;flex-wrap:wrap}
.ttl{font-family:Anton;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.status{flex:1;text-align:center;font-size:22px;font-weight:700;color:#f5c542;min-width:200px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool,.chip{background:#0a1477;border:0;border-radius:5px;padding:5px 10px;font-size:16px;font-weight:600;color:#c8cdf0}
.tool:hover,.chip:hover{background:#13239a;color:#fff}
.chip b{color:#f5c542;letter-spacing:.08em}
.main{min-height:0}
.board{display:grid;gap:clamp(4px,.55vw,10px);padding:clamp(6px,.8vw,14px);height:100%}
.cat{background:#0d1fb0;display:flex;align-items:center;justify-content:center;text-align:center;padding:.4em;font-weight:800;text-transform:uppercase;font-size:clamp(16px,1.9vw,36px);line-height:1;text-shadow:2px 2px 0 #000;box-shadow:inset 0 0 40px rgba(0,0,20,.45);text-wrap:balance}
.tile{background:#0d1fb0;border:0;color:#f5c542;font-family:Anton;font-size:clamp(26px,4.2vw,84px);text-shadow:3px 3px 0 #000;box-shadow:inset 0 0 40px rgba(0,0,20,.45);min-height:0;padding:0}
.tile:hover{background:#1a33dd}
.tile.used{background:#071273;cursor:default}
.tile.empty{background:#040a45;cursor:default}
.scores{display:grid;gap:8px;padding:8px 14px 12px;background:#000}
.team{background:#0d1fb0;border-top:6px solid var(--c);padding:6px 10px 8px;text-align:center;position:relative;border-radius:2px;transition:box-shadow .15s,opacity .15s}
.team.buzz{box-shadow:0 0 0 4px var(--c),0 0 36px var(--c)}
.team.locked{opacity:.38}
.tname{font-size:clamp(16px,1.4vw,26px);font-weight:800;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscore{font-family:Anton;font-size:clamp(28px,2.8vw,52px);line-height:1.05;text-shadow:2px 2px 0 #000}
.tscore.neg{color:#ff8a7a}
.picks{position:absolute;top:-6px;left:50%;transform:translate(-50%,-60%);background:var(--c);color:#000;font-weight:800;font-size:14px;text-transform:uppercase;padding:1px 8px;border-radius:3px;letter-spacing:.06em}
.adj{position:absolute;right:4px;top:4px;background:none;border:0;font-size:13px;color:#aeb6e8;opacity:0;padding:2px 4px}
.team:hover .adj{opacity:1}
.dev{font-size:13px;color:#aeb6e8;position:absolute;left:6px;top:4px}
/* clue */
.cluewrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(6px,.8vw,14px);gap:10px}
.cluehead{display:flex;justify-content:space-between;gap:20px;font-weight:800;text-transform:uppercase;font-size:clamp(18px,1.7vw,30px);padding:0 4px}
.cpts{font-family:Anton;font-weight:400;color:#f5c542}
.cluecard{background:#0d1fb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:3vh 5vw;text-align:center;box-shadow:inset 0 0 80px rgba(0,0,20,.5);transition:box-shadow .2s;overflow:auto}
.cluecard.open{box-shadow:inset 0 0 0 8px #f5c542,inset 0 0 120px rgba(245,197,66,.45)}
.cluetext{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;text-transform:uppercase;font-size:clamp(24px,3.4vw,66px);line-height:1.32;text-shadow:3px 3px 0 #000;text-wrap:balance;max-width:1500px}
.cluetext.small{font-size:clamp(18px,1.8vw,34px);opacity:.85}
.cluetext.mc{font-size:clamp(22px,2.7vw,52px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1vw,16px);width:min(1500px,100%)}
.choice{display:flex;align-items:center;gap:.6em;background:rgba(0,0,20,.35);border:2px solid rgba(255,255,255,.28);border-radius:8px;padding:.45em .8em;font-size:clamp(20px,2.1vw,40px);font-weight:700;text-align:left;color:#fff;line-height:1.1}
.choice b{font-family:Anton;font-weight:400;color:#f5c542;flex:none;width:1.2em}
button.choice:hover{border-color:#f5c542;background:rgba(245,197,66,.15)}
.choice.struck{opacity:.28;text-decoration:line-through}
.choice.picked{background:#7a1f16;border-color:#ff8a7a;opacity:1}
.choice.right{background:#1f8f4e;border-color:#5ee69a;opacity:1;text-decoration:none}
.answer{font-family:Anton;color:#f5c542;font-size:clamp(34px,4.6vw,90px);line-height:1.05;text-transform:uppercase;text-shadow:3px 3px 0 #000}
.ddsplash{font-family:Anton;text-transform:uppercase;font-size:clamp(70px,11vw,220px);line-height:.92;color:#f5c542;text-shadow:5px 5px 0 #000;letter-spacing:.02em}
.ddsplash.sm{font-size:clamp(40px,5vw,96px)}
.cardsub{font-size:clamp(20px,2vw,36px);font-weight:700}
.bigwager{font-family:Anton;font-size:clamp(60px,7vw,140px);line-height:1}
.fcat{font-family:'Libre Baskerville',serif;font-weight:700;text-transform:uppercase;font-size:clamp(30px,4vw,76px);text-shadow:3px 3px 0 #000}
.result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;background:rgba(0,0,0,.35);border-left:8px solid var(--c,#fff);padding:10px 22px;border-radius:4px;font-size:clamp(20px,2vw,36px)}
.result .rteam{font-weight:800;text-transform:uppercase}
.result .rans{font-family:'Libre Baskerville',serif;font-size:.9em}
.result .rdelta{font-family:Anton;letter-spacing:.02em}
.result.ok .rdelta{color:#5ee69a}.result.no .rdelta{color:#ff8a7a}
.fteam{font-family:Anton;text-transform:uppercase;font-size:clamp(40px,5vw,96px);color:var(--c);line-height:1;text-shadow:3px 3px 0 #000}
.fans{font-family:'Libre Baskerville',serif;font-size:clamp(26px,3vw,56px)}
.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:70px;padding:2px 4px}
.foot .msg{flex:1;font-size:22px;color:#c8cdf0;min-width:200px}
.foot input{width:150px;font-size:24px;padding:8px 10px;border-radius:6px;border:0;background:#fff;color:#000}
.buzznow{color:#f5c542!important;font-family:Anton;font-size:34px!important;text-transform:uppercase;letter-spacing:.04em}
.elig{display:flex;gap:6px;flex-wrap:wrap}.elig span{border-bottom:4px solid var(--c);font-weight:700;padding:0 4px}
.who{font-family:Anton;font-size:40px;text-transform:uppercase;color:var(--c);line-height:1}
.tbar{height:14px;background:rgba(255,255,255,.15);border-radius:7px;overflow:hidden;flex:1;min-width:160px}
.tbar>i{display:block;height:100%;background:#f5c542}
.tnum{font-family:Anton;font-size:40px;width:50px;text-align:center}
.fw{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.fw label{display:flex;align-items:center;gap:8px;background:#0a1477;border-left:6px solid var(--c);padding:4px 8px;border-radius:4px}
.fw label span{font-weight:700;font-size:18px}
.fw input{width:100px!important;font-size:20px!important;padding:4px 6px!important}
.fw em{color:#5ee69a;font-style:normal;font-weight:800}
.fstat{display:flex;gap:10px;flex-wrap:wrap}.fstat span{border-bottom:4px solid var(--c);padding:0 4px;font-weight:700;opacity:.55}.fstat span.in{opacity:1}
/* end */
.end{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px;text-align:center}
.winner{font-family:Anton;font-size:clamp(50px,7vw,130px);text-transform:uppercase;color:#f5c542;line-height:1;text-shadow:4px 4px 0 #000}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:min(640px,100%)}
.rank li{display:flex;justify-content:space-between;align-items:center;background:#0a1477;border-left:10px solid var(--c);padding:10px 20px;font-size:30px;font-weight:800;text-transform:uppercase}
.rank b{font-family:Anton;font-weight:400}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(2,4,30,.94);display:flex;align-items:center;justify-content:center;padding:30px;z-index:10}
.tut{width:min(1000px,100%);display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.tut h2{margin:0;font-family:Anton;font-weight:400;font-size:clamp(40px,4.4vw,80px);text-transform:uppercase;line-height:1;color:#f5c542;text-shadow:3px 3px 0 #000}
.tut p{margin:0;font-size:clamp(22px,2vw,34px);line-height:1.35;max-width:880px;text-wrap:pretty}
.tvis{min-height:180px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.tv-board{display:grid;grid-template-columns:repeat(3,120px);gap:6px}
.tv-board div{background:#0d1fb0;height:64px;display:grid;place-items:center;font-family:Anton;color:#f5c542;font-size:30px;text-shadow:2px 2px 0 #000}
.tv-board div.h{color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:18px;text-transform:uppercase}
.tv-clue{background:#0d1fb0;padding:22px 34px;font-family:'Libre Baskerville',serif;font-weight:700;font-size:30px;text-shadow:2px 2px 0 #000}
.tv-arrow{font-size:40px;color:#aeb6e8}
.tv-ans{background:#fff;color:#000;padding:14px 26px;border-radius:8px;font-size:34px;font-weight:700}
.tv-buzz{display:flex;gap:26px}
.tv-buzz span{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-family:Anton;font-size:30px;text-transform:uppercase}
.tv-buzz .wait{background:#2a3170;color:#9aa2d8}.tv-buzz .go{background:#f5c542;color:#0a0f3d;box-shadow:0 0 40px #f5c542}
.tv-pts{display:flex;gap:26px;font-family:Anton;font-size:64px}.tv-pts .plus{color:#5ee69a}.tv-pts .minus{color:#ff8a7a}
.tv-dd{font-family:Anton;font-size:80px;color:#f5c542;text-transform:uppercase;text-shadow:4px 4px 0 #000;background:#0d1fb0;padding:10px 40px}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#2a3170}.dots i.on{background:#f5c542}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#ff6b5a;color:#2a0500;font-weight:800;font-size:22px;padding:8px 18px;border-radius:6px;z-index:20;text-transform:uppercase}
.dropping::after{content:'Drop the CSV to load it';position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,7,43,.9);color:#f5c542;font-family:Anton;font-size:60px;z-index:30}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
</style>
</head>

  [1,2,3,4,5,6].map(c=>[100,200,300,400,500].map(p=>`Category ${c},${p},,,,,,`).join('\n')).join('\n') + '\nFinal Category,FINAL,,,,,,\n';

/* ---------- CSV ---------- */
function parseRows(text){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const d=lines.filter(l=>l.includes('\t')).length>=lines.length/2?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f.trim()==='')q=true,f='';
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
    else if(c!=='\r')f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.map(r=>r.map(s=>s.trim())).filter(r=>r.some(x=>x));
}
function parseSet(text){
  const rows=parseRows(text);let title='Review Game';const cats=[],errors=[];let final=null;
  const col={category:0,points:1,clue:2,answer:3,accept:4,wrong:[5,6,7]};
  rows.forEach((r,i)=>{const a=r[0]||'';
    if(a.startsWith('#')){const m=a.match(/^#\s*title\s*[:=]?\s*(.*)$/i);if(m)title=(m[1]||r[1]||'').trim()||title;return}
    if(/^category$/i.test(a)){col.wrong=[];r.forEach((x,j)=>{x=x.toLowerCase();
      if(x.startsWith('cat'))col.category=j;else if(x.startsWith('point')||x.startsWith('value'))col.points=j;
      else if(x.startsWith('clue')||x.startsWith('question')||x.startsWith('definition'))col.clue=j;
      else if(x.startsWith('answer')||x.startsWith('term'))col.answer=j;else if(x.includes('accept'))col.accept=j;else if(/wrong|distract|choice/.test(x))col.wrong.push(j)});return}
    const cat=r[col.category]||'',pts=r[col.points]||'',clue=r[col.clue]||'',ans=r[col.answer]||'';
    const acc=(r[col.accept]||'').split('|').map(s=>s.trim()).filter(Boolean);
    const wrong=col.wrong.map(j=>(r[j]||'').trim()).filter(Boolean);
    if(!clue&&!ans)return;
    if(!cat||!clue||!ans){errors.push(`Row ${i+1}: needs a category, clue and answer`);return}
    if(/final/i.test(pts)){final={category:cat,clue,answer:ans,accept:acc,wrong};return}
    const p=parseInt(pts.replace(/[^0-9]/g,''));
    if(!p){errors.push(`Row ${i+1}: points should be a number or FINAL`);return}
    let c=cats.find(x=>x.name.toLowerCase()===cat.toLowerCase());
    if(!c){if(cats.length>=6){errors.push(`Row ${i+1}: only 6 categories fit, "${cat}" skipped`);return}c={name:cat,clues:[]};cats.push(c)}
    if(c.clues.length>=6){errors.push(`Row ${i+1}: only 6 clues fit in "${cat}"`);return}
    c.clues.push({points:p,clue,answer:ans,accept:acc,wrong});
  });
  cats.forEach(c=>c.clues.sort((a,b)=>a.points-b.points));
  if(!cats.length)errors.unshift('No clues found. Check that the file has category, points, clue and answer columns.');
  return {title,cats,final,errors};
}
function toCSV(set){const e=s=>/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  const L=['#title: '+set.title,'category,points,clue,answer,also_accept,wrong_1,wrong_2,wrong_3'],w=q=>[0,1,2].map(k=>(q.wrong||[])[k]||'');
  set.cats.forEach(c=>c.clues.forEach(q=>L.push([c.name,q.points,q.clue,q.answer,q.accept.join('|'),...w(q)].map(x=>e(String(x))).join(','))));
  if(set.final)L.push([set.final.category,'FINAL',set.final.clue,set.final.answer,set.final.accept.join('|'),...w(set.final)].map(x=>e(String(x))).join(','));
  return L.join('\n')+'\n'}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- answer check ---------- */
function norm(s){s=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ');
  s=s.replace(/^\s*(what|who|where|when)\s+(is|are|was|were)\s+/,'');
  s=(' '+s+' ').replace(/ (the|a|an) /g,' ').replace(/ (the|a|an) /g,' ');return s.replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function check(input,answers){const x=norm(input);if(!x)return false;
  return answers.some(a=>{const y=norm(a);if(!y)return false;if(x===y)return true;
    const tol=y.length<=4?0:y.length<=8?1:2;if(lev(x,y)<=tol)return true;
    if(y.length>=5&&x.includes(y)&&x.length<=y.length+12)return true;return false})}

/* ---------- helpers ---------- */
const curQ=()=>S.board[S.cur.c].clues[S.cur.r];

const value=()=>S.cur.dd?(S.cur.wager||0):curQ().points;

const answersFor=q=>[q.answer,...(q.accept||[])];
const allAnswers=()=>[...S.set.cats.flatMap(c=>c.clues.map(q=>q.answer)),...(S.set.final?[S.set.final.answer]:[])];
function choicesFor(q){const same=a=>norm(a)===norm(q.answer);let w=[];
  (q.wrong||[]).forEach(x=>{if(!same(x)&&!w.some(y=>norm(y)===norm(x))&&w.length<3)w.push(x)});
  if(w.length<3){const wc=s=>s.trim().split(/\s+/).length,n=wc(q.answer);
    const pool=shuffle(allAnswers().filter(a=>!same(a)&&!w.some(y=>norm(y)===norm(a)))).sort((a,b)=>Math.abs(wc(a)-n)-Math.abs(wc(b)-n));
    w=w.concat(pool.slice(0,3-w.length))}
  return shuffle([q.answer,...w])}
function choicesHTML(ch,struck,correct,picked,clickable){return `<div class="choices">${ch.map((x,k)=>{const cls=['choice',struck.includes(k)?'struck':'',correct!=null&&x===correct?'right':'',picked===k?'picked':''].join(' ');

/* ---------- game flow ---------- */
function toLobby(){S.teams=S.teamNames.slice(0,S.teamCount).map((n,i)=>({name:(n||'').trim()||'Team '+(i+1),score:0,color:COLORS[i]}));S.phase='lobby';initPeer();render()}
function startGame(){
  S.teams.forEach(t=>t.score=0);
  S.board=S.set.cats.map(c=>({name:c.name,clues:c.clues.map(q=>({...q,used:false,dd:false}))}));
  const cand=shuffle(S.board.flatMap((c,ci)=>c.clues.map((q,ri)=>[ci,ri]).filter(([,ri])=>ri>0||c.clues.length===1)));
  const usedCols=[];let n=0;for(const [ci,ri] of cand){if(n>=S.ddCount)break;if(usedCols.includes(ci))continue;S.board[ci].clues[ri].dd=true;usedCols.push(ci);n++}
  S.control=0;S.cur=null;S.final=null;S.phase='board';S.tut=S.tutorial?0:null;render()}
function pick(c,r){const q=S.board[c]?.clues[r];if(S.phase!=='board'||!q||q.used)return;
  S.cur={c,r,dd:q.dd,state:q.dd?'dd-intro':'reading',buzzTeam:null,locked:[],early:{},answer:null,verdict:null,last:null,wager:null,ddTeam:S.control,timerEnd:0,timeUp:false,choices:S.style==='mc'?choicesFor(q):null,struck:[],picked:null};
  S.phase='clue';q.dd?sfx.dd():sfx.tile();render()}
function openBuzz(){const c=S.cur;if(!c||c.dd)return;c.state='open';c.buzzTeam=null;c.answer=null;c.timeUp=false;sfx.open();render()}
function buzz(i,conn){
  if(S.phase==='lobby'||S.phase==='board'){flash={i,until:Date.now()+700};if(S.phase==='lobby')sfx.buzz();render();setTimeout(render,750);return}
  if(S.phase!=='clue'||!S.cur||S.cur.dd)return;const c=S.cur,now=Date.now();
  if(c.state==='reading'){c.early[i]=now+1000;if(conn&&conn.open)conn.send({t:'early'});if(S.mode==='keys')toast(S.teams[i].name+': too early!');render();return}
  if(c.state!=='open'||c.locked.includes(i)||(c.early[i]||0)>now)return;
  c.buzzTeam=i;c.state='answering';c.timerEnd=now+S.timer*1000;c.answer=null;c.timeUp=false;sfx.buzz();render()}
function startDD(){const c=S.cur;c.buzzTeam=c.ddTeam;c.state='answering';c.timerEnd=Date.now()+S.timer*1000;c.answer=null;c.timeUp=false;sfx.open();render()}
function judge(ok){const c=S.cur;if(!c||c.state!=='answering')return;const t=c.buzzTeam,v=value();
  const d=ok?v:(S.subtract?-v:0);S.teams[t].score+=d;c.last={team:t,delta:d,ok,prevControl:S.control};
  c.state='judged';c.verdict=ok;if(ok)S.control=t;else if(!c.locked.includes(t))c.locked.push(t);ok?sfx.right():sfx.wrong();render()}
function override(){const c=S.cur,L=c&&c.last;if(!L)return;S.teams[L.team].score-=L.delta;S.control=L.prevControl;
  c.locked=c.locked.filter(x=>x!==L.team);c.state='answering';c.buzzTeam=L.team;
  if(c.choices&&c.picked!=null){c.struck=c.struck.filter(x=>x!==c.picked);if(L.ok)c.struck.push(c.picked)}judge(!L.ok)}
function choose(k){const c=S.cur;if(S.phase!=='clue'||!c||!c.choices||c.state!=='answering'||c.struck.includes(k)||!c.choices[k])return;
  c.answer=c.choices[k];c.picked=k;const ok=c.choices[k]===curQ().answer;if(!ok)c.struck.push(k);judge(ok)}
function timeUp(){const c=S.cur;if(!c||c.state!=='answering'||c.timeUp)return;
  if(S.mode==='net'&&c.answer==null){c.answer='';judge(false)}else{c.timeUp=true;sfx.wrong();render()}}
function onAnswer(i,text){const c=S.cur;if(S.phase!=='clue'||!c||c.state!=='answering'||c.buzzTeam!==i||c.answer!=null)return;
  c.answer=String(text).slice(0,120);judge(check(c.answer,answersFor(curQ())))}
function reveal(){S.cur.state='revealed';render()}
function toBoard(){if(S.cur)curQ().used=true;S.cur=null;

function readFinalInputs(){document.querySelectorAll('[data-fw]').forEach(el=>{const i=+el.dataset.fw;if(el.value!=='')S.final.wagers[i]=Math.max(0,Math.min(fMax(i),parseInt(el.value)||0))})}

  S.teams.forEach((_,i)=>f.verdicts[i]=S.mode==='net'?(f.choices?f.answers[i]===S.set.final.answer:check(f.answers[i]||'',answersFor(S.set.final))):false);render()}

/* ---------- networking (PeerJS, no account) ---------- */
let peer=null,conns=new Map(),peerStatus='off',peerTries=0;
function initPeer(){
  if(S.mode!=='net')return;
  if(typeof Peer==='undefined'){peerStatus='nolib';return}
  if(peer&&!peer.destroyed)return;
  peerStatus='connecting';
  peer=new Peer(PREFIX+S.code,{debug:0});
  peer.on('open',()=>{peerStatus='ready';peerTries=0;render()});
  peer.on('connection',c=>{conns.set(c,{team:null});
    c.on('open',()=>{sendSnap(c);render()});
    c.on('data',m=>onMsg(c,m));
    c.on('close',()=>{conns.delete(c);render()});
    c.on('error',()=>{})});
  peer.on('disconnected',()=>{if(peer&&!peer.destroyed)setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){peer.destroy();peer=null;peerTries++;
      if(peerTries<4){setTimeout(initPeer,2500)}else{S.code=genCode();peerTries=0;initPeer()}render();return}
    if(['network','server-error','socket-error','socket-closed','browser-incompatible','ssl-unavailable'].includes(err.type)){peerStatus='error';render()}
  });
}
function devices(i){let n=0;conns.forEach(v=>{if(v.team===i)n++});return n}
function onMsg(c,m){const info=conns.get(c);if(!info||!m||typeof m!=='object')return;
  if(m.t==='join'){const ok=Number.isInteger(m.team)&&S.teams[m.team]&&(!m.name||m.name===S.teams[m.team].name);
    info.team=ok?m.team:null;if(c.open)c.send({t:'joined',ok});render();return}
  if(m.t==='leave'){info.team=null;render();return}
  const i=info.team;if(i==null)return;
  if(m.t==='buzz')buzz(i,c);
  else if(m.t==='answer'){if(S.cur&&S.cur.choices&&Number.isInteger(m.choice)){if(S.cur.buzzTeam===i)choose(m.choice)}else onAnswer(i,m.text||'')}
  else if(m.t==='wager'){const w=parseInt(m.amount)||0;
    if(S.phase==='clue'&&S.cur&&S.cur.dd&&S.cur.state==='dd-wager'&&S.cur.ddTeam===i&&S.cur.wager==null){S.cur.wager=Math.max(0,Math.min(ddMax(i),w));render()}
    else if(S.phase==='final'&&S.final.state==='category'&&S.final.wagers[i]==null){S.final.wagers[i]=Math.max(0,Math.min(fMax(i),w));render()}}
  else if(m.t==='fanswer'){const f=S.final;if(S.phase==='final'&&f.state==='clue'&&f.answers[i]==null){f.answers[i]=f.choices&&Number.isInteger(m.choice)?(f.choices[m.choice]||''):String(m.text||'').slice(0,120);render()}}
}
function snap(team){const now=Date.now();
  const o={t:'snap',mc:S.style==='mc',title:S.set.title,phase:S.phase,mode:S.mode,you:team,control:S.control,timer:S.timer,teams:S.teams.map(t=>({name:t.name,score:t.score,color:t.color}))};
  if(S.phase==='clue'&&S.cur){const c=S.cur,q=curQ(),hid=c.state==='dd-intro'||c.state==='dd-wager';
    o.cur={id:c.c+'-'+c.r,state:c.state,dd:c.dd,ddTeam:c.ddTeam,buzzTeam:c.buzzTeam,locked:c.locked,category:S.board[c.c].name,points:q.points,
      clue:hid?'':q.clue,choices:hid?null:c.choices,struck:c.struck||[],wager:c.wager,wagerMax:c.dd?ddMax(c.ddTeam):0,timeLeft:c.state==='answering'&&!c.timeUp?Math.max(0,c.timerEnd-now):0,timeTotal:S.timer*1000,
      answered:c.answer!=null,verdict:c.state==='judged'?c.verdict:null,delta:c.state==='judged'&&c.last?c.last.delta:0,
      answer:(c.state==='revealed'||(c.state==='judged'&&c.verdict))?q.answer:''}}
  if(S.phase==='final'&&S.final&&S.set.final){const f=S.final;
    o.final={state:f.state,category:S.set.final.category,clue:f.state==='category'?'':S.set.final.clue,choices:f.state==='category'?null:f.choices,wagerMax:team!=null?fMax(team):0,
      wagered:team!=null&&f.wagers[team]!=null,answered:team!=null&&f.answers[team]!=null,
      timeLeft:f.state==='clue'&&!f.timeUp?Math.max(0,f.timerEnd-now):0,timeTotal:S.finalTimer*1000}}
  return o}
function sendSnap(c){const info=conns.get(c);if(c.open&&info)try{c.send(snap(info.team))}catch(e){}}

return `<div class="setup">

};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='closeJoin'&&e.target!==b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b,e)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.name!=null){S.teamNames[+el.dataset.name]=el.value;save()}
  if(el.dataset.fw!=null&&S.final){const i=+el.dataset.fw;if(el.value==='')delete S.final.wagers[i];else S.final.wagers[i]=Math.max(0,Math.min(fMax(i),parseInt(el.value)||0));save();broadcast()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f);e.target.value=''});
document.addEventListener('dragover',e=>{if(S.phase!=='setup')return;e.preventDefault();document.body.classList.add('dropping')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping')});
document.addEventListener('drop',e=>{if(S.phase!=='setup')return;e.preventDefault();document.body.classList.remove('dropping');const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f)});
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea,select')){if(e.key==='Enter'&&e.target.id==='ddw')ACT.showClue();return}
  if(S.tut!=null){if(e.key==='ArrowRight'||e.key==='Enter'||e.code==='Space'){e.preventDefault();ACT.tutNext()}else if(e.key==='ArrowLeft')ACT.tutPrev();else if(e.key==='Escape')ACT.tutClose();return}
  if(showJoin&&e.key==='Escape'){showJoin=false;render();return}
  if(S.mode==='keys'&&/^[1-6]$/.test(e.key)){const i=+e.key-1;if(i<S.teams.length)buzz(i);return}
  const c=S.cur;
  if(e.code==='Space'&&S.phase==='clue'&&c){e.preventDefault();
    if(c.state==='reading')c.dd?startDD():openBuzz();
    else if(c.state==='judged'&&!c.last.ok&&!c.dd&&eligible().length)openBuzz();return}
  if(e.key==='Enter'){
    if(S.phase==='clue'&&c){if(c.state==='revealed'||(c.state==='judged'&&c.last.ok))toBoard();else if(c.state==='judged')reveal()}
    else if(S.phase==='final'&&S.final.state==='reveal'){S.final.shown?fnext():(S.mode==='net'&&fshow())}}
});
setInterval(()=>{let end=0,total=0;
  if(S.phase==='clue'&&S.cur&&S.cur.state==='answering'&&!S.cur.timeUp){end=S.cur.timerEnd;total=S.timer*1000}
  else if(S.phase==='final'&&S.final&&S.final.state==='clue'&&!S.final.timeUp){end=S.final.timerEnd;total=S.finalTimer*1000}
  if(!end){lastTick=null;return}
  const left=end-Date.now(),bar=$('#tbar'),num=$('#tnum');
  if(bar)bar.style.width=Math.max(0,left/total*100)+'%';if(num)num.textContent=Math.max(0,Math.ceil(left/1000));
  const sec=Math.ceil(left/1000);if(sec<=3&&sec>0&&sec!==lastTick){lastTick=sec;sfx.tick()}
  if(left<=0){lastTick=null;if(S.phase==='clue')timeUp();else{S.final.timeUp=true;sfx.wrong();render()}}
},100);

/* ---------- boot ---------- */
(async()=>{const p=new URLSearchParams(location.search).get('set');
  if(p&&S.phase==='setup'){try{const r=await fetch(p);if(r.ok)S.set=parseSet(await r.text()),S.setLabel=p.split('/').pop()}catch(e){}}
  if(S.phase!=='setup')initPeer();render()})();
</script>
</body>
</html>
